syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_package = "com.elgato.streamdeck.vsd2";
option java_multiple_files = true;

message Endpoint {
  enum Source {
    STATIC = 0;
    ELGATO_DISCOVERY = 1;
    CACHE = 2;
    BONJOUR = 3;
  }
  string host = 1;
  uint32 port = 2;
  Source source = 3;
}

message KnownHost {
  message Device {
    enum Appearance {
      SYSTEM = 0;
      LIGHT = 1;
      DARK = 2;
    }
    enum KeypadOrientationOption {
      FIXED = 0;
      DYNAMIC = 1;
    }
    string rawID = 1;
    string rawWorkstationID = 2; // for back reference to known host
    google.protobuf.Timestamp createdAt = 3;
    google.protobuf.Timestamp updatedAt = 4;
    optional google.protobuf.Timestamp lastOpenedAt = 5;
    string displayName = 6; // name of the device chosen by the user
    uint32 iconWidth = 7;
    uint32 iconHeight = 8;
    uint32 keypadRows = 9;
    uint32 keypadColumns = 10;
    uint32 lastCustomKeypadRows = 11;
    uint32 lastCustomKeypadColumns = 12;
    bool isCustomLayout = 13;
    KeypadOrientationOption keypadRotation = 14;
    Appearance appearance = 15;
    oneof faceplate {
      string defaultFaceplate = 16;
      string customFaceplate = 17;
    };
  }

  string rawID = 1;
  string displayName = 2;
  optional Endpoint lastEndpoint = 3;
  google.protobuf.Timestamp createdAt = 4;
  google.protobuf.Timestamp updatedAt = 5;
  // Mark deleted so it doesn't resurface if a reachability check on this workstation succeeds
  // and recreates a new instance of this.
  optional google.protobuf.Timestamp deletedAt = 6;
  bool isAuthenticated = 7;
  repeated Device devices = 8;
}

message StaticHost {
  string rawID = 1;
  string displayName = 2;
  repeated Endpoint endpoint = 3;
  google.protobuf.Timestamp createdAt = 4;
  google.protobuf.Timestamp updatedAt = 5;
  // Mark deleted so it doesn't resurface if a reachability check on this workstation succeeds
  // and recreates a new instance of this.
  optional google.protobuf.Timestamp deletedAt = 6;
}

message AppMetrics {
  google.protobuf.Timestamp installedAt = 1;
  uint64 connectionDurationSeconds = 2;
  // The last time we triggered the in-app review flow.
  optional google.protobuf.Timestamp lastReviewRequest = 3;
  // The last app version we triggered the in-app review flow on.
  optional string lastReviewRequestVersion = 4;
  // The last app version which did show its onboarding screen.
  optional string lastSeenOnboardingVersion = 5;
}

message AppUpdates {
  optional int32 hideOutdatedSDKVersionAlert = 1;
  optional int64 shownOutdatedSDKVersionAlertDate = 2;
  optional int64 shownAppUpdateAvailableAlertDate = 3;
}

message AppSettings {
  bytes publicKey = 1;
  bytes secretKey = 2;
  repeated KnownHost knownHosts = 3;
  optional string lastOpenedDeviceRawID = 4;
  bool isProUser = 5;
  optional bool isForcedProUser = 6; // debug build override
  repeated StaticHost staticHost = 7;
  AppMetrics appMetrics = 8;
  optional AppUpdates appUpdates = 9;
}
